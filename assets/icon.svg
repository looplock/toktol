<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Toktol">
<title>Toktol — 62 Gauge Aurora White</title>
<!--
变体：弧改为纯白，只让背景承担颜色；在极光底上最干净、小尺寸最稳
-->
<defs>
<linearGradient id="aBase" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#A78BFA"/>
<stop offset="0.48" stop-color="#818CF8"/>
<stop offset="1" stop-color="#22D3EE"/>
</linearGradient>
<radialGradient id="aPink" cx="0.78" cy="0.20" r="0.55">
<stop offset="0" stop-color="#F472B6" stop-opacity="0.88"/>
<stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
</radialGradient>
<radialGradient id="aGold" cx="0.16" cy="0.84" r="0.52">
<stop offset="0" stop-color="#FBBF24" stop-opacity="0.72"/>
<stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
</radialGradient>
<linearGradient id="aRim" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
<stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
<stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
</linearGradient>
</defs>
<rect width="1024" height="1024" rx="225" fill="url(#aBase)"/>
<rect width="1024" height="1024" rx="225" fill="url(#aPink)"/>
<rect width="1024" height="1024" rx="225" fill="url(#aGold)"/>
<rect x="5" y="5" width="1014" height="1014" rx="220" fill="none" stroke="url(#aRim)" stroke-width="10"/>
<!-- 主体：全白仪表盘 -->
<path d="M212 640 A300 300 0 0 1 812 640" fill="none" stroke="#FFFFFF"
stroke-width="95" stroke-linecap="round"/>
<line x1="570" y1="571" x2="688" y2="430" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>
<path d="M600 640 A88 88 0 1 0 424 640 A88 88 0 1 0 600 640 Z
M546 640 A34 34 0 1 1 478 640 A34 34 0 1 1 546 640 Z"
fill="#FFFFFF" fill-rule="evenodd"/>
</svg>
